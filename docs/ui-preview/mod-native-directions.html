<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTR Navigation · Create / MTR 原生方向</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151817;color:#eee;font-family:"Microsoft YaHei UI","PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}.page{max-width:1600px;margin:auto;padding:24px 28px 36px}.eyebrow{font-size:11px;letter-spacing:.17em;color:#a5afa9}.page h1{margin:6px 0;font-size:24px}.intro{font-size:13px;color:#acb5af;margin:0 0 18px}.switch{display:flex;gap:8px;margin-bottom:14px}.switch button{background:#292e2b;border:1px solid #535d56;color:#d8ded9;padding:8px 15px;font-size:12px}.switch button.active{background:#d2b078;color:#252720;border-color:#d2b078}.game{position:relative;padding:42px 24px 24px;background:linear-gradient(#10171466,#101714a0),url("gameplay.png") center/cover;border:1px solid #4a514c;min-height:690px;display:grid;place-items:center}.game-label{position:absolute;top:13px;left:15px;font-size:11px;background:#111b;padding:5px 8px}.compare .game{padding:42px 12px 16px;grid-template-columns:1fr 1fr;gap:14px;align-items:center}.compare .direction-label{display:block}.direction-label{display:none;text-align:center;font-weight:bold;font-size:13px;margin-bottom:9px;text-shadow:1px 1px #000}.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.note{background:#202522;border:1px solid #465048;padding:14px}.note h3{font-size:13px;margin:0 0 6px;color:#d7bc88}.note p{font-size:12px;color:#acb6ae;line-height:1.7;margin:0}

.create-ui{width:min(850px,100%);height:590px;position:relative;background:url("create-schedule-reference.png") center/100% 100% no-repeat;image-rendering:pixelated;color:#2e2822;padding:30px 36px 62px;font-family:"Minecraft","Microsoft YaHei UI",monospace;filter:drop-shadow(8px 10px 0 #0005)}.create-title{height:30px;display:flex;align-items:center;gap:10px;font-weight:bold;font-size:15px}.create-title .gear{width:21px;height:21px;background:#76634c;border:3px outset #b69a70;display:grid;place-items:center;color:#eadaba;font-size:11px}.create-tabs{margin-left:auto;display:flex;gap:4px}.create-btn{background:#a7a69e;color:#282823;border:2px solid;border-color:#e0ded2 #565750 #565750 #e0ded2;box-shadow:2px 2px 0 #282923;padding:5px 11px;min-height:28px;font-size:11px;text-shadow:1px 1px #ffffff55}.create-btn:hover{background:#c3c0b2}.create-btn:active{border-color:#565750 #e0ded2 #e0ded2 #565750;box-shadow:1px 1px #222}.create-btn.primary{background:#c89b52;border-color:#efd292 #6c4d26 #6c4d26 #efd292;color:#2c251b;font-weight:bold}.create-btn.selected{background:#746858;color:#fff1d2;border-color:#4e453b #c0a98a #c0a98a #4e453b;text-shadow:1px 1px #000}.create-btn:disabled{opacity:.45}.create-body{background:#292a28;border:3px solid;border-color:#111 #73736c #73736c #111;box-shadow:inset 2px 2px #0008;padding:12px;height:458px;display:flex;flex-direction:column}.create-inputs{display:grid;grid-template-columns:1fr 32px 1fr 70px;gap:7px;align-items:end}.create-label{font-size:10px;color:#dbd6c8;display:block;margin-bottom:5px;text-shadow:1px 1px #000}.create-input{width:100%;height:31px;background:#171817;color:#f0eadc;border:2px solid;border-color:#080908 #62635c #62635c #080908;padding:5px 8px;font-size:12px}.create-swap{height:31px;padding:2px}.create-tools{display:flex;gap:6px;margin:9px 0}.create-tools .hint{margin-left:auto;align-self:center;color:#bbb6a9;font-size:10px}.create-results{display:grid;grid-template-columns:35% 1fr;gap:9px;min-height:0;flex:1}.create-cards{display:flex;flex-direction:column;gap:7px}.create-card{background:#4d4941;color:#f0e9d9;border:2px solid;border-color:#767064 #25241f #25241f #767064;padding:9px;min-height:81px;box-shadow:2px 2px #151512}.create-card.selected{background:#765f37;border-color:#d6b773 #30271b #30271b #d6b773}.create-card strong{font-size:11px}.create-card p{font-size:10px;color:#d1c9b8;line-height:1.55;margin:6px 0}.create-card .fast{color:#ffe09b}.create-detail{background:#1e201e;border:2px solid #10110f;padding:10px 12px;color:#eae5d8;overflow:hidden}.create-detail h3{font-size:13px;margin:0 0 4px;color:#f3d493}.create-detail .sub{font-size:10px;color:#aaa99f;margin-bottom:11px}.create-leg{border-left:3px solid #5084a0;padding:0 0 11px 10px;margin-left:4px}.create-leg.walk{border-color:#ba9a60}.create-leg strong{font-size:11px}.create-leg p{font-size:10px;color:#b9b8ae;line-height:1.55;margin:4px 0}.create-bottom{position:absolute;left:40px;right:40px;bottom:21px;height:31px;display:flex;align-items:center;gap:8px}.create-status{font-size:10px;margin-right:auto;color:#4c473d}.create-ui .rivet{position:absolute;width:6px;height:6px;background:#514b41;border:1px solid #ded7c7;box-shadow:1px 1px #222}.create-ui .r1{left:20px;top:20px}.create-ui .r2{right:20px;top:20px}.create-ui .r3{left:20px;bottom:20px}.create-ui .r4{right:20px;bottom:20px}
/* MTR: full-screen utility dashboard, not a container inventory panel. */
.mtr-ui{width:min(1080px,100%);height:610px;background:#101010ee;color:#f2f2f2;font-family:"Minecraft","Microsoft YaHei UI",monospace;border-top:2px solid #777;box-shadow:0 8px 30px #0008;display:flex;flex-direction:column;padding:0 18px}.mtr-header{height:55px;display:flex;align-items:stretch;border-bottom:1px solid #5b5b5b}.mtr-brand{display:flex;align-items:center;font-size:13px;font-weight:bold;padding-right:24px}.mtr-brand i{display:inline-block;width:8px;height:25px;background:#42a5c6;margin-right:9px}.mtr-tab{border:0;border-bottom:3px solid transparent;background:transparent;color:#aaa;padding:0 16px;font-size:12px}.mtr-tab.active{color:#fff;border-bottom-color:#eee;background:#ffffff0b}.mtr-close{margin-left:auto;align-self:center}.mtr-btn{height:30px;background:#3c3c3c;color:#f2f2f2;border:1px solid #888;box-shadow:inset 1px 1px #ffffff16,inset -1px -1px #000;padding:4px 12px;font-size:11px}.mtr-btn:hover{background:#565656;border-color:#fff}.mtr-btn.primary{background:#e6e6e6;color:#151515;border-color:#fff;font-weight:bold}.mtr-main{padding:16px 0 10px;display:flex;flex-direction:column;flex:1;min-height:0}.mtr-inputs{display:grid;grid-template-columns:1fr 34px 1fr 86px;gap:8px;align-items:end}.mtr-label{display:block;font-size:10px;color:#bbb;margin-bottom:6px}.mtr-input{height:33px;width:100%;background:#050505;color:#fff;border:1px solid #aaa;padding:6px 9px;font-size:12px}.mtr-tools{display:flex;align-items:center;gap:7px;margin:10px 0 13px}.mtr-tools .count{margin-left:auto;font-size:11px;color:#bbb}.mtr-results{display:grid;grid-template-columns:38% 1fr;min-height:0;flex:1;border:1px solid #555}.mtr-list{border-right:1px solid #555;overflow:hidden}.panel-heading{height:29px;background:#2b2b2b;color:#ccc;font-size:10px;padding:8px 10px;border-bottom:1px solid #555}.mtr-row{padding:11px 12px;border-bottom:1px solid #3e3e3e;background:#181818;min-height:82px}.mtr-row:nth-child(odd){background:#202020}.mtr-row.selected{background:#343434;border-left:4px solid #e8e8e8;padding-left:8px}.mtr-row strong{font-size:12px}.mtr-row .best{color:#74c6de;font-size:10px;margin-left:8px}.mtr-row p{font-size:10px;color:#bbb;line-height:1.6;margin:5px 0}.mtr-detail{padding:13px 16px;overflow:hidden;background:#151515}.mtr-detail h3{font-size:15px;margin:0 0 5px}.mtr-detail .sub{font-size:10px;color:#aaa;margin-bottom:13px}.mtr-leg{display:grid;grid-template-columns:8px 1fr;gap:10px;padding-bottom:12px}.mtr-leg .line{background:#2e9dbb;position:relative}.mtr-leg .line:before{content:"";position:absolute;width:8px;height:8px;background:#fff;top:3px}.mtr-leg.walk .line{background:#777}.mtr-leg.walk .line:before{background:#aaa}.mtr-leg strong{font-size:11px}.mtr-leg p{font-size:10px;line-height:1.6;color:#b7b7b7;margin:4px 0}.mtr-footer{display:flex;align-items:center;gap:9px;border-top:1px solid #555;padding:12px 0 14px}.mtr-footer .note-text{font-size:10px;color:#aaa;margin-right:auto}.mtr-footer .primary{min-width:145px}
@media(max-width:900px){.compare .game{grid-template-columns:1fr}.page{padding:18px 10px}.game{padding:40px 8px 12px}.create-ui{transform:scale(.92)}.notes{grid-template-columns:1fr}}@media(max-width:650px){.create-results,.mtr-results{grid-template-columns:1fr}.create-detail,.mtr-detail{display:none}.create-inputs,.mtr-inputs{grid-template-columns:1fr 34px}.create-inputs .primary,.mtr-inputs .primary{grid-column:2}.create-ui{padding:26px 30px 58px}.mtr-tab:nth-of-type(n+3){display:none}}
</style></head><body><main class="page" id="page"><div class="eyebrow">MTR NAVIGATION / NATIVE MOD DIRECTIONS</div><h1>Create 机械控制台 / MTR 铁路仪表盘</h1><p class="intro">两条路线分别遵循对应模组的界面语言，不再是通用面板的换色版本。示例数据与布局内容保持一致。</p><div class="switch"><button class="active" data-mode="create">Create 机械控制台</button><button data-mode="mtr">MTR 铁路仪表盘</button><button data-mode="compare">并排比较</button></div><section class="game" id="game"><span class="game-label">游戏内背景预览 · 原生模组方向</span><div id="createSlot"></div><div id="mtrSlot"></div></section><section class="notes"><article class="note"><h3>Create 路线 · 机械层次来自结构</h3><p>采用官方时刻表材质的机箱轮廓、深色内嵌显示区、厚斜面按钮、机械灰与黄铜重点。装饰集中在机壳，不侵入文字区。</p></article><article class="note"><h3>MTR 路线 · 仪表板而非物品容器</h3><p>全屏深色工作区、细分隔线、列表与地图式信息层级。弱化外壳和按钮质感，更接近 MTR 原生 Dashboard。</p></article></section></main>
<script>
const create=()=>`<div><h2 class="direction-label">Create · 机械控制台</h2><section class="create-ui"><i class="rivet r1"></i><i class="rivet r2"></i><i class="rivet r3"></i><i class="rivet r4"></i><header class="create-title"><span class="gear">M</span>铁路导航仪<nav class="create-tabs"><button class="create-btn selected">换乘</button><button class="create-btn">到发</button><button class="create-btn">导航</button></nav></header><div class="create-body"><div class="create-inputs"><label><span class="create-label">起点站</span><input class="create-input" value="戴安澜" readonly></label><button class="create-btn create-swap">⇄</button><label><span class="create-label">终点站</span><input class="create-input" value="甘地" readonly></label><button class="create-btn primary">查询</button></div><div class="create-tools"><button class="create-btn">车站</button><button class="create-btn">定位</button><button class="create-btn">步行</button><span class="hint">5 个可行方案</span></div><div class="create-results"><div class="create-cards"><article class="create-card"><strong>01　10 分钟 <span class="fast">最快</span></strong><p>无需换乘 · 9:40 到达<br>滨海都市 4 号线</p></article><article class="create-card selected"><strong>02　10 分钟 <span class="fast">最快</span></strong><p>换乘 2 次 · 步行 1 分钟<br>环线 → 环线 → 4 号线</p></article><article class="create-card"><strong>03　12 分钟</strong><p>换乘 1 次 · 11:12 到达<br>环线 → 环线</p></article></div><div class="create-detail"><h3>方案 02 · 行程机构</h3><div class="sub">戴安澜 → 甘地　/　预计 9:40 到达</div><div class="create-leg"><strong>滨海都市环线 · 外环站台</strong><p>戴安澜 1:48 发车<br>轭湖湾 2:54 到达</p></div><div class="create-leg walk"><strong>步行换乘 · 约 1 分钟</strong><p>轭湖湾外环 → 内环站台</p></div><div class="create-leg"><strong>滨海都市环线 · 南苑方向</strong><p>另候车约 36 秒</p></div></div></div></div><footer class="create-bottom"><span class="create-status">02 / 05　已选择</span><button class="create-btn">设置</button><button class="create-btn primary">开始导航</button></footer></section></div>`;
const mtr=()=>`<div><h2 class="direction-label">MTR · 铁路仪表盘</h2><section class="mtr-ui"><header class="mtr-header"><div class="mtr-brand"><i></i>站间物语</div><button class="mtr-tab active">换乘查询</button><button class="mtr-tab">车站到发</button><button class="mtr-tab">当前导航</button><button class="mtr-btn mtr-close">×</button></header><div class="mtr-main"><div class="mtr-inputs"><label><span class="mtr-label">起点</span><input class="mtr-input" value="戴安澜" readonly></label><button class="mtr-btn">⇄</button><label><span class="mtr-label">终点</span><input class="mtr-input" value="甘地" readonly></label><button class="mtr-btn primary">查询</button></div><div class="mtr-tools"><button class="mtr-btn">全部车站</button><button class="mtr-btn">定位</button><button class="mtr-btn">步行换乘</button><button class="mtr-btn">最快到达⌄</button><span class="count">找到 5 个方案</span></div><div class="mtr-results"><div class="mtr-list"><div class="panel-heading">可行行程 / JOURNEYS</div><article class="mtr-row"><strong>方案 1　10 分钟</strong><span class="best">最快</span><p>换乘 0 次 · 9:40 到达<br>滨海都市 4 号线</p></article><article class="mtr-row selected"><strong>方案 2　10 分钟</strong><span class="best">最快</span><p>换乘 2 次 · 步行 1 分钟<br>环线 → 环线 → 4 号线</p></article><article class="mtr-row"><strong>方案 3　12 分钟</strong><p>换乘 1 次 · 11:12 到达<br>环线 → 环线</p></article></div><div class="mtr-detail"><div class="panel-heading" style="margin:-13px -16px 12px">行程详情 / ITINERARY</div><h3>10 分钟 · 换乘 2 次</h3><div class="sub">戴安澜 → 甘地　·　9:40 到达</div><div class="mtr-leg"><span class="line"></span><div><strong>滨海都市环线　→　浮冰</strong><p>戴安澜 C2 外环站台　1:48 发车<br>轭湖湾外环站台　2:54 到达</p></div></div><div class="mtr-leg walk"><span class="line"></span><div><strong>步行前往轭湖湾内环站台</strong><p>约 1 分钟 · MTR 连接估算</p></div></div><div class="mtr-leg"><span class="line"></span><div><strong>滨海都市环线　→　南苑</strong><p>另候车约 36 秒</p></div></div></div></div></div><footer class="mtr-footer"><span class="note-text">方案 2 / 5　·　点击站名查看到发</span><button class="mtr-btn">HUD 设置</button><button class="mtr-btn primary">开始导航</button></footer></section></div>`;
let mode='create';const page=document.getElementById('page'),cs=document.getElementById('createSlot'),ms=document.getElementById('mtrSlot');function render(){page.classList.toggle('compare',mode==='compare');cs.innerHTML=mode!=='mtr'?create():'';ms.innerHTML=mode!=='create'?mtr():'';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});const requested=new URLSearchParams(location.search).get('mode');if(requested)mode=requested;render();
</script></body></html>
