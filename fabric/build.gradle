plugins { id 'fabric-loom' version '1.16.3' }
def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
def minecraftTarget = providers.gradleProperty('minecraft_version').getOrElse(shared.getProperty('minecraft_version'))
def targets = new groovy.json.JsonSlurper().parse(file('../gradle/minecraft-targets.json'))
def target = targets[minecraftTarget]
if (target == null) throw new GradleException("Unsupported Minecraft target: ${minecraftTarget}. Available: ${targets.keySet()}")
if (minecraftTarget != '1.21.1') layout.buildDirectory = file("../build/targets/${minecraftTarget}-fabric")
version = shared.getProperty('mod_version')
group = shared.getProperty('maven_group')
base.archivesName = 'MTR-Navigation-fabric'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = uri('../.cache/maven'); content { includeModule 'net.fabricmc', 'sponge-mixin' } }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraftTarget}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${target.fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabric_api}"
    def mtrJar = file("../.cache/downloads/MTR-fabric-${target.mtr}+${minecraftTarget}.jar")
    if (!mtrJar.isFile()) throw new GradleException("Missing ${mtrJar.name}. Run: python tools/download_dependencies.py --minecraft ${minecraftTarget}")
    modCompileOnly files(mtrJar)
    if (project.hasProperty('runtimeMtr')) modRuntimeOnly files(mtrJar)
}
sourceSets.main.java.srcDir('../src/main/java')
sourceSets.main.java.srcDir("../src/minecraft/${minecraftTarget}/java")
sourceSets.main.java.exclude('io/github/teamcreating/mtrnav/platform/neoforge/**')
sourceSets.main.resources.srcDir('../src/main/resources')
sourceSets.main.resources.exclude('META-INF/neoforge.mods.toml')
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraftTarget
    filesMatching('fabric.mod.json') { expand(version: project.version, minecraft_version: minecraftTarget) }
}
loom {
    runs {
        client {
            runDir project.hasProperty('oreReview') ? "../run/ui-review/${minecraftTarget}-fabric-ore${project.hasProperty('oreFixtures') ? '-fixtures' : ''}" : project.hasProperty('paradigmPreview') ? "../run/ui-review/${minecraftTarget}-fabric-paradigms" : project.hasProperty('v2Review') ? "../run/ui-review/${minecraftTarget}-fabric-v2" : project.hasProperty('uiPreview') ? "../run/ui-review/${minecraftTarget}-fabric" : minecraftTarget == '1.21.1' ? '../run/fabric' : "../run/${minecraftTarget}-fabric"
            if(project.hasProperty('oreReview')) {
                if(project.hasProperty('oreBackground'))vmArg '-Dmtrnav.oreBackgroundQa=true'
                vmArg '-Dmtrnav.oreReview=true'
                vmArg "-Dmtrnav.uiPreviewLabel=${minecraftTarget}-fabric-ore${project.hasProperty('oreFixtures') ? '-fixtures' : ''}"
                if(project.hasProperty('oreFixtures')) {vmArg '-Dmtrnav.uiPreview=true';vmArg '-Dmtrnav.v2Review=true'}
            }
            if (project.hasProperty('paradigmPreview')) {
                vmArg '-Dmtrnav.uiPreview=true'
                vmArg '-Dmtrnav.paradigmPreview=true'
                vmArg "-Dmtrnav.uiPreviewLabel=${minecraftTarget}-fabric-paradigms"
            }
            if(project.hasProperty('v2Review')) { vmArg '-Dmtrnav.uiPreview=true'; vmArg '-Dmtrnav.v2Review=true'; vmArg "-Dmtrnav.uiPreviewLabel=${minecraftTarget}-fabric-v2" }
            if (project.hasProperty('quickplay')) { programArg '--quickPlaySingleplayer'; programArg project.property('quickplay').toString() }
            if (project.hasProperty('nativeSmoke')) vmArg '-Dmtrnav.forceNative=true'
            if (project.hasProperty('uiPreview')) vmArg '-Dmtrnav.uiPreview=true'
            if (project.hasProperty('uiPreview')) vmArg "-Dmtrnav.uiPreviewLabel=${minecraftTarget}-fabric"
            if (project.hasProperty('uiPreviewFont')) vmArg "-Dmtrnav.uiPreviewFont=${project.property('uiPreviewFont')}"
            if (project.hasProperty('uiPreviewScene')) vmArg "-Dmtrnav.uiPreviewScene=${project.property('uiPreviewScene')}"
            if (project.hasProperty('uiPreviewVariant')) vmArg "-Dmtrnav.uiPreviewVariant=${project.property('uiPreviewVariant')}"
        }
        server { runDir minecraftTarget == '1.21.1' ? '../run-server/fabric' : "../run-server/${minecraftTarget}-fabric"; programArg '--nogui' }
    }
}
jar { from('../LICENSE', '../NOTICE'); exclude('assets/mtrnav/textures/gui/create/**') }
